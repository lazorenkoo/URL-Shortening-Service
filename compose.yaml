services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: ${DB_USER:-shortener}
      # Local development only.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shortener}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
